# XcodeGen spec — generate the Xcode project on a Mac with:
#   brew install xcodegen && cd iosApp && xcodegen generate && open PartyMusik.xcodeproj
name: PartyMusik
options:
  bundleIdPrefix: io.mahajan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # set your team
targets:
  PartyMusik:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mahajan.partymusik
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Kotlin framework (ComposeApp)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: PartyMusik
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: "PartyMusik uses the microphone only for in-app calls and to measure speaker delay during the sync test. Audio is never stored."
        NSBluetoothAlwaysUsageDescription: "PartyMusik uses Bluetooth to recognise your audio accessories."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Spike CSV exports (Documents/exports) visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
